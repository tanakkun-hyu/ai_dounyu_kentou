<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>社内AI 論点ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1F0; --panel:#FAFBFA; --line:#D3DAD8; --ink:#16252B; --ink2:#4A5A60; --muted:#6F7E83;
  --accent:#0E6E78; --accent-ink:#FFFFFF;
  --r-it:#2F5DA8; --r-it-bg:#E3EBF7; --r-so:#8A5A12; --r-so-bg:#F5EBD9;
  --r-us:#0E6E78; --r-us-bg:#DCEEEE; --r-en:#7A3C78; --r-en-bg:#F1E3F0;
  --st-open:#8A5A12; --st-open-bg:#F7EBD5; --st-done:#1D6B3A; --st-done-bg:#DDF0E2;
  --st-hold:#5B6670; --st-hold-bg:#E4E8EA; --danger:#A33A2A;
  --f-display:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111A1D; --panel:#18242A; --line:#2C3B41; --ink:#E6EDEE; --ink2:#B4C2C6; --muted:#8C9CA1;
  --accent:#4FB3BC; --accent-ink:#0B1A1D;
  --r-it:#8DB1EE; --r-it-bg:#1E2C44; --r-so:#E2B66E; --r-so-bg:#3A2E1A;
  --r-us:#6FCBD3; --r-us-bg:#163638; --r-en:#D9A3D6; --r-en-bg:#38243A;
  --st-open:#E2B66E; --st-open-bg:#3A2E1A; --st-done:#7FD39A; --st-done-bg:#1B3524;
  --st-hold:#AAB6BC; --st-hold-bg:#2A3439; --danger:#F08C7A; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:.02em}
.sub{color:var(--ink2);margin:2px 0 0;font-size:14px}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
textarea{width:100%;resize:vertical;min-height:84px}
input[type=text]{width:100%}
#myName{width:9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.link{border:none;background:none;color:var(--muted);padding:2px 6px;font-size:13px}
button.link:hover{color:var(--ink)}
button.link.danger:hover{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.notice{background:var(--st-open-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
aside.list{display:flex;flex-direction:column;gap:10px}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.issue-btn{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.issue-btn[aria-current="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.issue-btn .t{font-weight:700;line-height:1.5}
.issue-btn .m{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.st-open{color:var(--st-open);background:var(--st-open-bg)}
.st-done{color:var(--st-done);background:var(--st-done-bg)}
.st-hold{color:var(--st-hold);background:var(--st-hold-bg)}
.new-issue{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:8px}
main.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:22px;min-width:0}
.d-head{display:flex;flex-direction:column;gap:10px}
.d-title{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h2{font-family:var(--f-display);font-weight:900;font-size:24px;margin:0;line-height:1.4}
.goal{background:var(--bg);border-radius:8px;padding:12px 14px}
.goal p{margin:2px 0 0;white-space:pre-wrap}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.status-row button{font-size:13px;padding:4px 12px;border-radius:999px}
.status-row button[aria-pressed="true"].s-open{background:var(--st-open-bg);color:var(--st-open);border-color:var(--st-open)}
.status-row button[aria-pressed="true"].s-done{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done)}
.status-row button[aria-pressed="true"].s-hold{background:var(--st-hold-bg);color:var(--st-hold);border-color:var(--st-hold)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.role-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.role-h{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:6px;font-weight:700;font-size:14px}
.role-h .n{font-weight:500;font-size:12px}
.post{border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:10px 12px;background:var(--panel);min-width:0}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.empty-role{font-size:13px;color:var(--muted);padding:6px 2px;margin:0}
.r-it .role-h{background:var(--r-it-bg);color:var(--r-it)} .r-it .post{border-left-color:var(--r-it)}
.r-so .role-h{background:var(--r-so-bg);color:var(--r-so)} .r-so .post{border-left-color:var(--r-so)}
.r-us .role-h{background:var(--r-us-bg);color:var(--r-us)} .r-us .post{border-left-color:var(--r-us)}
.r-en .role-h{background:var(--r-en-bg);color:var(--r-en)} .r-en .post{border-left-color:var(--r-en)}
.composer{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:18px}
.composer .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.decision{border:2px solid var(--st-done);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.decision h3{margin:0;font-size:15px;color:var(--st-done);font-family:var(--f-display);font-weight:900}
.decision p{margin:0;white-space:pre-wrap}
.edit-row{display:flex;gap:8px;flex-wrap:wrap}
.placeholder{color:var(--muted);text-align:center;padding:40px 10px}
.hint{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>社内AI 論点ボード</h1>
      <p class="sub">論点ごとに、立場の違う意見を並べて整理し、決まったことを残す場所</p>
    </div>
    <div class="who">
      <label class="me" for="myName">名前 <input id="myName" type="text" maxlength="30" placeholder="例：山田"></label>
      <label class="me" for="myRole">立場
        <select id="myRole">
          <option value="it">システム（PC担当）</option>
          <option value="so">総務</option>
          <option value="us">ユーザー（技術部）</option>
          <option value="en">設計技術者</option>
        </select>
      </label>
    </div>
  </header>

  <div id="notice" class="notice" hidden><span id="noticeText"></span><button class="link" type="button" id="noticeClose">閉じる</button></div>

  <form id="gate" class="new-issue" hidden style="max-width:520px">
    <span class="label">合言葉の入力</span>
    <p class="hint">メンバーに伝えられている合言葉を入力してください。このブラウザに記憶されるので、次回からは入力不要です。</p>
    <input id="passIn" type="password" autocomplete="current-password" placeholder="合言葉">
    <button class="primary" type="submit">入る</button>
  </form>

  <div class="grid" id="board">
    <aside class="list">
      <div class="list-head"><span class="label">論点の一覧</span><button class="link" type="button" id="reload">最新にする</button></div>
      <div id="issues" style="display:flex;flex-direction:column;gap:8px"><p class="hint">読み込み中…</p></div>
      <form id="newIssue" class="new-issue">
        <span class="label">論点を追加</span>
        <input id="niTitle" type="text" placeholder="例：議事録の作成にも使うか" maxlength="80" required>
        <textarea id="niGoal" placeholder="この論点で決めたいこと（1〜2行）" maxlength="400" style="min-height:60px"></textarea>
        <button class="primary" type="submit">追加する</button>
      </form>
    </aside>
    <main id="detail" class="detail"><p class="placeholder">読み込み中…</p></main>
  </div>
</div>

<script>
(function(){
  var ROLES=[{k:"it",name:"システム（PC担当）",cls:"r-it"},{k:"so",name:"総務",cls:"r-so"},{k:"us",name:"ユーザー（技術部）",cls:"r-us"},{k:"en",name:"設計技術者",cls:"r-en"}];
  var ST={open:{name:"議論中",cls:"st-open",b:"s-open"},done:{name:"合意",cls:"st-done",b:"s-done"},hold:{name:"保留",cls:"st-hold",b:"s-hold"}};
  var state={issues:[],posts:[],sel:null,editing:null,decEditing:false,loaded:false};
  var $=function(id){return document.getElementById(id)};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var KEY=lsGet("editKey");if(!KEY){KEY=Math.random().toString(36).slice(2)+Date.now().toString(36);lsSet("editKey",KEY)}

  function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="text")e.textContent=attrs[k];else if(k==="cls")e.className=attrs[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e}
  function fmt(t){if(!t)return"";var d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
  function notice(msg){if(!msg){$("notice").hidden=true;return}$("noticeText").textContent=msg;$("notice").hidden=false}
  $("noticeClose").addEventListener("click",function(){notice("")});

  // ▼▼▼ Apps Script をデプロイしたときの URL（…/exec で終わるもの）に置き換える ▼▼▼
  var API_URL="https://script.google.com/macros/s/AKfycbzmRrYgKlspsWtMBISt8oEHDkK_cdTjxlhbPsPKxsochsNd3w3sox5qeYtgYwjckOKfrg/exec";
  // ▲▲▲ ここまで ▲▲▲

  var PASS=lsGet("pass")||"";
  function showGate(msg){$("gate").hidden=false;$("board").hidden=true;if(msg)notice(msg);$("passIn").focus()}
  $("gate").addEventListener("submit",function(ev){ev.preventDefault();var p=$("passIn").value.trim();if(!p)return;PASS=p;lsSet("pass",p);notice("");
    $("gate").hidden=true;$("board").hidden=false;load(true)});

  function call(fn){var args=Array.prototype.slice.call(arguments,1);
    if(API_URL.indexOf("https://script.google.com/")!==0)return Promise.reject(new Error("index.html の API_URL に、Apps Script のウェブアプリURLが設定されていません。"));
    return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:fn,args:args,key:KEY,pass:PASS})})
      .then(function(r){if(!r.ok)throw new Error("サーバーに接続できませんでした（"+r.status+"）。");return r.json()})
      .then(function(j){if(!j.ok){if(/合言葉が違います/.test(j.error)){PASS="";lsSet("pass","");showGate(j.error);var e=new Error(j.error);e.silent=true;throw e}throw new Error(j.error)}return j.data})}
  function apply(data){state.issues=data.issues||[];state.posts=data.posts||[];state.loaded=true;render()}
  function fail(e){if(e&&e.silent)return;notice((e&&e.message)?e.message:"保存できませんでした。少し待ってから、もう一度お試しください。")}

  var savedRole=lsGet("myRole");if(savedRole)$("myRole").value=savedRole;
  $("myRole").addEventListener("change",function(){lsSet("myRole",this.value);var r=$("pRole");if(r)r.value=this.value;render(true)});
  $("myName").value=lsGet("myName")||"";
  $("myName").addEventListener("input",function(){lsSet("myName",this.value)});
  state.sel=lsGet("selIssue");

  function sortedIssues(){var o={open:0,hold:1,done:2};return state.issues.slice().sort(function(a,b){return((o[a.status]||0)-(o[b.status]||0))||((a.createdAt||0)-(b.createdAt||0))})}

  function renderList(){
    var box=$("issues");box.textContent="";
    var list=sortedIssues();
    if(!list.length){box.appendChild(el("p",{cls:"hint",text:"まだ論点がありません。下の「論点を追加」から最初の論点を作ってください。"}));return}
    list.forEach(function(i){
      var n=state.posts.filter(function(p){return p.issueId===i.id}).length;var st=ST[i.status]||ST.open;
      box.appendChild(el("button",{cls:"issue-btn",type:"button","aria-current":String(i.id===state.sel),onclick:function(){state.sel=i.id;state.editing=null;state.decEditing=false;lsSet("selIssue",i.id);render(true)}},[
        el("span",{cls:"t",text:i.title||"（無題）"}),
        el("span",{cls:"m"},[el("span",{cls:"chip "+st.cls,text:st.name}),el("span",{text:"意見 "+n+"件"})])]));
    });
  }

  function renderDetail(){
    var d=$("detail");d.textContent="";
    var i=state.issues.filter(function(x){return x.id===state.sel})[0];
    if(!i){d.appendChild(el("p",{cls:"placeholder",text:"左の一覧から論点を選んでください。"}));return}
    var st=i.status||"open";
    var head=el("div",{cls:"d-head"});
    if(state.editing==="issue"){
      var t=el("input",{type:"text",maxlength:"80"});t.value=i.title||"";
      var g=el("textarea",{maxlength:"400"});g.value=i.goal||"";
      head.appendChild(el("span",{cls:"label",text:"論点を編集"}));head.appendChild(t);head.appendChild(g);
      head.appendChild(el("div",{cls:"edit-row"},[
        el("button",{cls:"primary",type:"button",text:"保存",onclick:function(){var nt=t.value.trim();if(!nt)return;call("updateIssue",i.id,{title:nt,goal:g.value}).then(function(dt){state.editing=null;apply(dt)},fail)}}),
        el("button",{type:"button",text:"やめる",onclick:function(){state.editing=null;render(true)}}),
        el("button",{cls:"link danger",type:"button",text:"この論点を削除",onclick:function(){var b=this;if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="本当に削除する（意見も消えます）";return}
          call("deleteIssue",i.id).then(function(dt){state.sel=null;state.editing=null;apply(dt)},fail)}})]));
    }else{
      head.appendChild(el("div",{cls:"d-title"},[el("h2",{text:i.title||"（無題）"}),el("button",{cls:"link",type:"button",text:"編集",onclick:function(){state.editing="issue";render(true)}})]));
      if(i.goal)head.appendChild(el("div",{cls:"goal"},[el("span",{cls:"label",text:"この論点で決めたいこと"}),el("p",{text:i.goal})]));
    }
    var sr=el("div",{cls:"status-row"});
    ["open","done","hold"].forEach(function(k){sr.appendChild(el("button",{type:"button",cls:ST[k].b,"aria-pressed":String(st===k),text:ST[k].name,onclick:function(){if(st===k)return;call("updateIssue",i.id,{status:k}).then(apply,fail)}}))});
    head.appendChild(sr);d.appendChild(head);

    if(st==="done"||i.decision||state.decEditing){
      var dec=el("div",{cls:"decision"},[el("h3",{text:st==="done"?"決定事項":"決定事項（案）"})]);
      if(state.decEditing){
        var ta=el("textarea",{maxlength:"1000",placeholder:"合意した内容を、後から入る人にも分かるように書く"});ta.value=i.decision||"";dec.appendChild(ta);
        dec.appendChild(el("div",{cls:"edit-row"},[el("button",{cls:"primary",type:"button",text:"保存",onclick:function(){call("updateIssue",i.id,{decision:ta.value}).then(function(dt){state.decEditing=false;apply(dt)},fail)}}),el("button",{type:"button",text:"やめる",onclick:function(){state.decEditing=false;render(true)}})]));
      }else{
        dec.appendChild(el("p",{text:i.decision||"まだ書かれていません。"}));
        dec.appendChild(el("div",{},[el("button",{cls:"link",type:"button",text:i.decision?"書き直す":"決定事項を書く",onclick:function(){state.decEditing=true;render(true)}})]));
      }
      d.appendChild(dec);
    }

    var posts=state.posts.filter(function(p){return p.issueId===i.id}).sort(function(a,b){return(a.createdAt||0)-(b.createdAt||0)});
    var used=ROLES.filter(function(r){return r.k!=="en"||posts.some(function(p){return p.role==="en"})||$("myRole").value==="en"});
    var roles=el("div",{cls:"roles"});
    used.forEach(function(r){
      var mine=posts.filter(function(p){return p.role===r.k});
      var col=el("div",{cls:"role-col "+r.cls},[el("div",{cls:"role-h"},[el("span",{text:r.name}),el("span",{cls:"n",text:mine.length+"件"})])]);
      if(!mine.length)col.appendChild(el("p",{cls:"empty-role",text:"まだ意見はありません"}));
      mine.forEach(function(p){
        var card=el("div",{cls:"post"});
        if(state.editing==="post:"+p.id){
          var ta=el("textarea",{maxlength:"2000"});ta.value=p.body||"";card.appendChild(ta);
          card.appendChild(el("div",{cls:"edit-row",style:"margin-top:6px"},[el("button",{cls:"primary",type:"button",text:"保存",onclick:function(){var v=ta.value.trim();if(!v)return;call("updatePost",p.id,v).then(function(dt){state.editing=null;apply(dt)},fail)}}),el("button",{type:"button",text:"やめる",onclick:function(){state.editing=null;render(true)}})]));
        }else{
          card.appendChild(el("p",{text:p.body||""}));
          var meta=el("div",{cls:"meta"},[el("span",{text:(p.name?p.name+"　":"")+fmt(p.createdAt)+(p.editedAt?"（編集済）":"")})]);
          if(p.mine){meta.appendChild(el("span",{},[
            el("button",{cls:"link",type:"button",text:"編集",onclick:function(){state.editing="post:"+p.id;render(true)}}),
            el("button",{cls:"link danger",type:"button",text:"削除",onclick:function(){var b=this;if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="削除する？";return}call("deletePost",p.id).then(apply,fail)}})]))}
          card.appendChild(meta);
        }
        col.appendChild(card);
      });
      roles.appendChild(col);
    });
    d.appendChild(el("div",{style:"display:flex;flex-direction:column;gap:10px"},[el("span",{cls:"label",text:"立場ごとの意見"}),roles]));

    var rs=el("select",{id:"pRole"});ROLES.forEach(function(r){rs.appendChild(el("option",{value:r.k,text:r.name}))});rs.value=$("myRole").value;
    var body=el("textarea",{id:"pBody",maxlength:"2000",placeholder:"意見・懸念・確認したいことを書く。理由も一言添えると議論が進みます。"});
    var draftKey="draft:"+i.id;var dv=lsGet(draftKey);if(dv)body.value=dv;
    body.addEventListener("input",function(){lsSet(draftKey,body.value)});
    var btn=el("button",{cls:"primary",type:"submit",text:"意見を書き込む"});
    var form=el("form",{cls:"composer"},[el("label",{cls:"label",for:"pBody",text:"この論点に意見を書く"}),body,el("div",{cls:"row"},[el("label",{cls:"me",for:"pRole"},[document.createTextNode("立場 "),rs]),btn])]);
    form.addEventListener("submit",function(ev){ev.preventDefault();var v=body.value.trim();if(!v)return;
      if(!$("myName").value.trim()){notice("右上の「名前」を入力してから書き込んでください。");$("myName").focus();return}
      btn.disabled=true;
      call("addPost",i.id,rs.value,$("myName").value.trim(),v).then(function(dt){body.value="";lsSet(draftKey,"");btn.disabled=false;apply(dt)},function(e){btn.disabled=false;fail(e)})});
    d.appendChild(form);
  }

  function busy(){var a=document.activeElement;return state.editing||state.decEditing||(a&&/TEXTAREA|INPUT|SELECT/.test(a.tagName)&&a.value)}
  function render(force){
    if(state.sel&&!state.issues.some(function(x){return x.id===state.sel}))state.sel=null;
    if(!state.sel&&state.issues.length)state.sel=sortedIssues()[0].id;
    renderList();
    if(!force&&busy()){ // 入力中は詳細を描き直さない（入力が消えないように）
      return}
    renderDetail();
  }

  function load(force){return call("getData").then(function(dt){state.issues=dt.issues||[];state.posts=dt.posts||[];state.loaded=true;render(force)},fail)}
  $("reload").addEventListener("click",function(){load(true)});
  $("newIssue").addEventListener("submit",function(ev){ev.preventDefault();var t=$("niTitle").value.trim();if(!t)return;
    call("addIssue",t,$("niGoal").value).then(function(dt){$("niTitle").value="";$("niGoal").value="";var list=dt.issues||[];var last=list.reduce(function(a,b){return(b.createdAt||0)>(a.createdAt||0)?b:a},list[0]);if(last){state.sel=last.id;lsSet("selIssue",last.id)}apply(dt)},fail)});

  if(PASS)load(true);else showGate();
  // 30秒ごとに他のメンバーの書き込みを取り込む（入力中は画面を保つ）
  setInterval(function(){if(document.visibilityState==="visible"&&PASS&&$("gate").hidden)load(false)},30000);
})();
</script>
</body>
</html>
