<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI導入へ向けての論点整理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1F0; --panel:#FAFBFA; --line:#D3DAD8; --ink:#16252B; --ink2:#4A5A60; --muted:#6F7E83;
  --accent:#0E6E78; --accent-ink:#FFFFFF; --unread:#FFF3D6; --unread-line:#D9A23A; --unread-ink:#7A4E00;
  --r-sv:#2F5DA8; --r-so:#8A5A12; --r-gi:#0E6E78; --r-en:#7A3C78;
  --st-open:#8A5A12; --st-open-bg:#F7EBD5; --st-done:#1D6B3A; --st-done-bg:#DDF0E2;
  --danger:#A33A2A; --pending:#6F7E83;
  --f-display:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111A1D; --panel:#18242A; --line:#2C3B41; --ink:#E6EDEE; --ink2:#B4C2C6; --muted:#8C9CA1;
  --accent:#4FB3BC; --accent-ink:#0B1A1D; --unread:#3A2E14; --unread-line:#D9A23A; --unread-ink:#F2C46D;
  --r-sv:#8DB1EE; --r-so:#E2B66E; --r-gi:#6FCBD3; --r-en:#D9A3D6;
  --st-open:#E2B66E; --st-open-bg:#3A2E1A; --st-done:#7FD39A; --st-done-bg:#1B3524;
  --danger:#F08C7A; --pending:#8C9CA1; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:.02em}
h2{font-family:var(--f-display);font-weight:900;font-size:24px;margin:0;line-height:1.4}
h3{font-family:var(--f-display);font-weight:900;font-size:17px;margin:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{width:100%;resize:vertical}
input[type=text],input[type=password],select{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.link{border:none;background:none;color:var(--muted);padding:2px 6px;font-size:13px}
button.link:hover{color:var(--ink)}
button.link.danger:hover{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:0}

/* ログイン画面 */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login .field{display:flex;flex-direction:column;gap:4px}
.login .err{color:var(--danger);font-size:14px;margin:0}

/* ボード */
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.whoami{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.notice{background:var(--st-open-bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
aside.list{display:flex;flex-direction:column;gap:10px}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.issue-btn{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.issue-btn.unread{background:var(--unread);border-color:var(--unread-line)}
.issue-btn[aria-current="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.issue-btn .t{font-weight:700;line-height:1.5}
.issue-btn .m{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.new-badge{font-size:11px;font-weight:700;color:var(--unread-ink);border:1px solid var(--unread-line);border-radius:999px;padding:0 7px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.st-open{color:var(--st-open);background:var(--st-open-bg)}
.st-done{color:var(--st-done);background:var(--st-done-bg)}
.new-issue{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:8px}
main.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:26px;min-width:0}
.d-head{display:flex;flex-direction:column;gap:10px}
.d-title{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.goal{background:var(--bg);border-radius:8px;padding:12px 14px}
.goal p{margin:2px 0 0;white-space:pre-wrap}
.status-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status-row button{font-size:13px;padding:4px 14px;border-radius:999px}
.status-row button[aria-pressed="true"].s-open{background:var(--st-open-bg);color:var(--st-open);border-color:var(--st-open)}
.status-row button[aria-pressed="true"].s-done{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done)}
.decision{border:2px solid var(--st-done);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.decision h3{color:var(--st-done)}
.decision .note{font-size:13px;color:var(--ink2);font-weight:400;font-family:var(--f-body)}
.decision textarea{min-height:90px}
.dec-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 掲示板（スレッド） */
.thread{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.post{padding:14px 2px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.post .ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:14px}
.post .no{color:var(--muted);font-variant-numeric:tabular-nums}
.post .who{font-weight:700}
.post .role{font-weight:700}
.post .time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.post .acts{margin-left:auto}
.post .body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:2px}
.post.pending{opacity:.6}
.post.amend .body{background:var(--st-done-bg);border-radius:6px;padding:6px 10px}
.role-sv{color:var(--r-sv)} .role-so{color:var(--r-so)} .role-gi{color:var(--r-gi)} .role-en{color:var(--r-en)}
.empty{color:var(--muted);font-size:14px;padding:14px 2px;margin:0;border-bottom:1px solid var(--line)}
.composer{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:16px}
.composer textarea{min-height:160px}
.composer .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.closed{background:var(--st-done-bg);color:var(--ink);border-radius:8px;padding:14px 16px;font-size:14px}
.edit-row{display:flex;gap:8px;flex-wrap:wrap}
.placeholder{color:var(--muted);text-align:center;padding:40px 10px}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login" class="login" hidden>
  <form id="loginForm">
    <h1>AI導入へ向けての論点整理</h1>
    <p class="hint">メンバー専用です。名前を入れて入ってください。</p>
    <div class="field"><label class="label" for="inName">名前</label><input id="inName" type="text" maxlength="30" placeholder="例：山田" autocomplete="username" required></div>
    <div class="field" id="passField" hidden><label class="label" for="inPass">合言葉（このブラウザで初めて入るときだけ必要です）</label><input id="inPass" type="password" autocomplete="current-password"></div>
    <p id="loginErr" class="err" hidden></p>
    <button class="primary" type="submit" id="loginBtn">入る</button>
  </form>
</div>

<!-- ボード画面 -->
<div id="app" class="wrap" hidden>
  <header>
    <div>
      <h1>AI導入へ向けての論点整理</h1>
    </div>
    <div class="whoami"><span id="whoami"></span><button class="link" type="button" id="logout">ログアウト</button></div>
  </header>

  <div id="notice" class="notice" hidden><span id="noticeText"></span><button class="link" type="button" id="noticeClose">閉じる</button></div>

  <div class="grid">
    <aside class="list">
      <div class="list-head"><span class="label">論点の一覧</span><button class="link" type="button" id="reload">最新にする</button></div>
      <div id="issues" style="display:flex;flex-direction:column;gap:8px"><p class="hint">読み込み中…</p></div>
      <form id="newIssue" class="new-issue">
        <span class="label">論点を追加</span>
        <input id="niTitle" type="text" placeholder="論点のタイトル" maxlength="80" required>
        <textarea id="niGoal" placeholder="この論点で決めたいこと（1〜2行）" maxlength="400" style="min-height:60px"></textarea>
        <button class="primary" type="submit" id="niBtn">追加する</button>
      </form>
    </aside>
    <main id="detail" class="detail"><p class="placeholder">読み込み中…</p></main>
  </div>
</div>

<script>
(function(){
  // ▼▼▼ Apps Script をデプロイしたときの URL（…/exec で終わるもの）に置き換える ▼▼▼
  var API_URL="https://script.google.com/macros/s/AKfycbzmRrYgKlspsWtMBISt8oEHDkK_cdTjxlhbPsPKxsochsNd3w3sox5qeYtgYwjckOKfrg/exec";
  // ▲▲▲ ここまで ▲▲▲

  var ROLE_CLS={"測量":"sv","総務":"so","技術":"gi","設計技術者":"en"};
  var ST={open:{name:"議論中",cls:"st-open",b:"s-open"},done:{name:"合意",cls:"st-done",b:"s-done"}};
  var state={issues:[],posts:[],sel:null,editing:null,amend:{},decDraft:{}};
  var $=function(id){return document.getElementById(id)};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
  var KEY=lsGet("editKey");if(!KEY){KEY=Math.random().toString(36).slice(2)+Date.now().toString(36);lsSet("editKey",KEY)}
  var ME={pass:lsGet("pass")||"",name:lsGet("myName")||"",role:""};
  var seen={};try{seen=JSON.parse(lsGet("seen")||"{}")||{}}catch(e){seen={}}

  function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="text")e.textContent=attrs[k];else if(k==="cls")e.className=attrs[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e}
  function fmt(t){if(!t)return"";var d=new Date(t);return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
  function notice(msg){if(!msg){$("notice").hidden=true;return}$("noticeText").textContent=msg;$("notice").hidden=false}
  $("noticeClose").addEventListener("click",function(){notice("")});

  /* ---------- 通信 ---------- */
  function call(fn){var args=Array.prototype.slice.call(arguments,1);
    if(API_URL.indexOf("https://script.google.com/")!==0)return Promise.reject(new Error("index.html の API_URL に、Apps Script のウェブアプリURLが設定されていません。"));
    return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:fn,args:args,key:KEY,pass:ME.pass,name:ME.name})})
      .then(function(r){if(!r.ok)throw new Error("サーバーに接続できませんでした（"+r.status+"）。");return r.json()})
      .then(function(j){if(!j.ok){if(/合言葉が違います/.test(j.error)){ME.pass="";lsDel("pass");}
        if(/合言葉|登録されていない/.test(j.error)&&!$("app").hidden){showLogin(j.error);var e=new Error(j.error);e.silent=true;throw e}throw new Error(j.error)}return j.data})}
  function fail(e){if(e&&e.silent)return;notice((e&&e.message)?e.message:"保存できませんでした。少し待ってから、もう一度お試しください。")}
  function apply(data){state.issues=data.issues||[];state.posts=data.posts||[];render()}

  /* ---------- ログイン ---------- */
  function showLogin(err){$("app").hidden=true;$("login").hidden=false;$("inName").value=ME.name;$("inPass").value="";
    $("passField").hidden=!!ME.pass;$("loginErr").textContent=err||"";$("loginErr").hidden=!err;(ME.name&&!ME.pass?$("inPass"):$("inName")).focus()}
  function showApp(){$("login").hidden=true;$("app").hidden=false;$("whoami").textContent=ME.name+"（"+(ME.role||"立場未登録")+"）でログイン中"}
  $("logout").addEventListener("click",function(){ME.name="";lsDel("myName");showLogin()});
  function login(){return call("login").then(function(dt){ME.name=dt.me.name;ME.role=dt.me.role;lsSet("myName",ME.name);lsSet("pass",ME.pass);showApp();apply(dt.board)})}
  $("loginForm").addEventListener("submit",function(ev){ev.preventDefault();
    var n=$("inName").value.trim();if(!n)return;
    if(!ME.pass){var p=$("inPass").value.trim();if(!p){$("passField").hidden=false;$("loginErr").textContent="このブラウザで初めて入るため、合言葉を入力してください。";$("loginErr").hidden=false;$("inPass").focus();return}ME.pass=p}
    ME.name=n;$("loginBtn").disabled=true;$("loginBtn").textContent="確認中…";
    login().then(function(){$("loginBtn").disabled=false;$("loginBtn").textContent="入る"},
      function(e){$("loginBtn").disabled=false;$("loginBtn").textContent="入る";
        if(/合言葉/.test(e.message)){ME.pass="";lsDel("pass")}
        showLogin(e.message)})});

  /* ---------- 未読の判定（このブラウザで最後に見た時刻と比べる） ---------- */
  function lastActivity(i){var t=Math.max(i.createdAt||0,i.updatedAt||0);state.posts.forEach(function(p){if(p.issueId===i.id&&!p.pending)t=Math.max(t,p.createdAt||0,p.editedAt||0)});return t}
  function isUnread(i){return lastActivity(i)>(seen[i.id]||0)}
  function markSeen(i){var t=lastActivity(i);if(t>(seen[i.id]||0)){seen[i.id]=t;lsSet("seen",JSON.stringify(seen))}}
  function newCount(i){var s=seen[i.id]||0;return state.posts.filter(function(p){return p.issueId===i.id&&!p.mine&&(p.createdAt||0)>s}).length}

  function sortedIssues(){var o={open:0,done:1};return state.issues.slice().sort(function(a,b){return((o[a.status]||0)-(o[b.status]||0))||((a.createdAt||0)-(b.createdAt||0))})}

  function renderList(){
    var box=$("issues");box.textContent="";
    var list=sortedIssues();
    if(!list.length){box.appendChild(el("p",{cls:"hint",text:"まだ論点がありません。下の「論点を追加」から最初の論点を作ってください。"}));return}
    list.forEach(function(i){
      var n=state.posts.filter(function(p){return p.issueId===i.id}).length;var st=ST[i.status]||ST.open;
      var unread=i.id!==state.sel&&isUnread(i);var nc=unread?newCount(i):0;
      box.appendChild(el("button",{cls:"issue-btn"+(unread?" unread":""),type:"button","aria-current":String(i.id===state.sel),onclick:function(){state.sel=i.id;state.editing=null;lsSet("selIssue",i.id);render(true)}},[
        el("span",{cls:"t",text:i.title||"（無題）"}),
        el("span",{cls:"m"},[el("span",{cls:"chip "+st.cls,text:st.name}),el("span",{text:"意見 "+n+"件"}),
          unread?el("span",{cls:"new-badge",text:nc?("新着 "+nc+"件"):"未読"}):null])]));
    });
  }

  function renderDetail(){
    var d=$("detail");d.textContent="";
    var i=state.issues.filter(function(x){return x.id===state.sel})[0];
    if(!i){d.appendChild(el("p",{cls:"placeholder",text:state.issues.length?"左の一覧から論点を選んでください。":"まだ論点がありません。左の「論点を追加」から作ってください。"}));return}
    markSeen(i);
    var done=i.status==="done";

    // 見出し
    var head=el("div",{cls:"d-head"});
    if(state.editing==="issue"){
      var t=el("input",{type:"text",maxlength:"80"});t.value=i.title||"";
      var g=el("textarea",{maxlength:"400",style:"min-height:70px"});g.value=i.goal||"";
      head.appendChild(el("span",{cls:"label",text:"論点を編集"}));head.appendChild(t);head.appendChild(g);
      head.appendChild(el("div",{cls:"edit-row"},[
        el("button",{cls:"primary",type:"button",text:"保存",onclick:function(){var nt=t.value.trim();if(!nt)return;this.disabled=true;call("updateIssue",i.id,{title:nt,goal:g.value}).then(function(dt){state.editing=null;apply(dt)},fail)}}),
        el("button",{type:"button",text:"やめる",onclick:function(){state.editing=null;render(true)}}),
        el("button",{cls:"link danger",type:"button",text:"この論点を削除",onclick:function(){var b=this;if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="本当に削除する（意見も消えます）";return}
          b.disabled=true;call("deleteIssue",i.id).then(function(dt){state.sel=null;state.editing=null;apply(dt)},fail)}})]));
    }else{
      head.appendChild(el("div",{cls:"d-title"},[el("h2",{text:i.title||"（無題）"}),el("button",{cls:"link",type:"button",text:"論点を編集",onclick:function(){state.editing="issue";render(true)}})]));
      if(i.goal)head.appendChild(el("div",{cls:"goal"},[el("span",{cls:"label",text:"この論点で決めたいこと"}),el("p",{text:i.goal})]));
    }
    var sr=el("div",{cls:"status-row"},[el("span",{cls:"label",text:"状態"})]);
    ["open","done"].forEach(function(k){sr.appendChild(el("button",{type:"button",cls:ST[k].b,"aria-pressed":String(i.status===k),text:ST[k].name,onclick:function(){
      if(i.status===k)return;
      if(k==="done"&&!(i.decision||"").trim()){notice("合意にする前に、ページ下の決定事項欄に書いて「決定事項を保存」を押してください。");return}
      var b=this;b.disabled=true;call("updateIssue",i.id,{status:k}).then(apply,function(e){b.disabled=false;fail(e)})}}))});
    head.appendChild(sr);d.appendChild(head);


    // 意見（掲示板形式）
    var posts=state.posts.filter(function(p){return p.issueId===i.id}).sort(function(a,b){return(a.createdAt||0)-(b.createdAt||0)});
    var thread=el("div",{cls:"thread"});
    if(!posts.length)thread.appendChild(el("p",{cls:"empty",text:"まだ意見はありません。"}));
    posts.forEach(function(p,idx){
      var amend=/^【決定事項の修正】/.test(p.body||"");
      var item=el("article",{cls:"post"+(p.pending?" pending":"")+(amend?" amend":"")});
      var acts=null;
      if(p.mine&&!done&&!p.pending&&state.editing!=="post:"+p.id){acts=el("span",{cls:"acts"},[
        el("button",{cls:"link",type:"button",text:"編集",onclick:function(){state.editing="post:"+p.id;render(true)}}),
        el("button",{cls:"link danger",type:"button",text:"削除",onclick:function(){var b=this;if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="削除する？";return}b.disabled=true;call("deletePost",p.id).then(apply,fail)}})])}
      item.appendChild(el("div",{cls:"ph"},[
        el("span",{cls:"no",text:(idx+1)+"."}),
        el("span",{cls:"who",text:p.name||"（名前なし）"}),
        el("span",{cls:"role role-"+(ROLE_CLS[p.role]||""),text:"（"+(p.role||"")+"）"}),
        el("span",{cls:"time",text:p.pending?"送信中…":(fmt(p.createdAt)+(p.editedAt?"（編集済）":""))}),acts]));
      if(state.editing==="post:"+p.id){
        var et=el("textarea",{maxlength:"2000",style:"min-height:120px"});et.value=p.body||"";item.appendChild(et);
        item.appendChild(el("div",{cls:"edit-row"},[el("button",{cls:"primary",type:"button",text:"保存",onclick:function(){var v=et.value.trim();if(!v)return;this.disabled=true;call("updatePost",p.id,v).then(function(dt){state.editing=null;apply(dt)},fail)}}),el("button",{type:"button",text:"やめる",onclick:function(){state.editing=null;render(true)}})]));
      }else item.appendChild(el("p",{cls:"body",text:p.body||""}));
      thread.appendChild(item);
    });
    d.appendChild(el("section",{style:"display:flex;flex-direction:column;gap:10px"},[el("h3",{text:"意見（"+posts.length+"件）"}),thread]));

    // 意見欄
    var amendMode=done&&state.amend[i.id];
    if(done&&!amendMode){
      d.appendChild(el("div",{cls:"closed",text:"この論点は合意済みのため、意見欄は閉じています。下の決定事項を修正したときは、ここに修正の意図を書き込めるようになります。再び議論する場合は、状態を「議論中」に戻してください。"}));
    }else{
    var body=el("textarea",{id:"pBody",maxlength:"2000",placeholder:amendMode?"決定事項をどう修正したか、なぜ修正したかを書く":"意見・懸念・確認したいことを書く。理由も一言添えると議論が進みます。"});
    var draftKey="draft:"+i.id;var dv=lsGet(draftKey);if(dv)body.value=dv;
    body.addEventListener("input",function(){lsSet(draftKey,body.value)});
    var btn=el("button",{cls:"primary",type:"submit",text:"書き込む"});
    var form=el("form",{cls:"composer"},[
      el("label",{cls:"label",for:"pBody",text:amendMode?"意見欄（決定事項の修正の意図）":"意見欄"}),
      el("p",{cls:"hint",text:"投稿者："+ME.name+"（"+(ME.role||"")+"）"}),
      body,el("div",{cls:"row"},[el("span",{cls:"hint",text:"書き込んだ意見は、議論中の間は自分で編集・削除できます。"}),btn])]);
    form.addEventListener("submit",function(ev){ev.preventDefault();var v=body.value.trim();if(!v)return;
      btn.disabled=true;
      // 送信中の意見をすぐ表示する（サーバーの応答には数秒かかるため）
      var tmp={id:"tmp"+Date.now(),issueId:i.id,role:ME.role,name:ME.name,body:(amendMode?"【決定事項の修正】":"")+v,createdAt:Date.now(),mine:true,pending:true};
      state.posts.push(tmp);body.value="";lsSet(draftKey,"");render(true);
      call("addPost",i.id,v,amendMode?true:false).then(function(dt){if(amendMode)delete state.amend[i.id];apply(dt)},
        function(e){state.posts=state.posts.filter(function(p){return p!==tmp});lsSet(draftKey,v);render(true);fail(e)})});
    d.appendChild(form);
    }

    // 決定事項（意見の下。まとめ役が意見欄でまとめてから書き込む）
    var draft=state.decDraft[i.id];var cur=(draft!==undefined)?draft:(i.decision||"");
    var ta=el("textarea",{id:"decText",maxlength:"2000",placeholder:"ここに決定事項を書く"});ta.value=cur;
    var saveBtn=el("button",{cls:"primary",type:"button",text:"決定事項を保存"});
    var saveHint=el("span",{cls:"hint"});
    function syncDec(){var changed=ta.value.trim()!==(i.decision||"").trim();saveBtn.disabled=!changed;saveHint.textContent=changed?"未保存の変更があります":""}
    ta.addEventListener("input",function(){state.decDraft[i.id]=ta.value;syncDec()});
    saveBtn.addEventListener("click",function(){
      var before=(i.decision||"").trim(),after=ta.value.trim();if(before===after)return;
      saveBtn.disabled=true;saveBtn.textContent="保存中…";
      call("updateIssue",i.id,{decision:after}).then(function(dt){
        delete state.decDraft[i.id];
        if(done&&before){state.amend[i.id]=true;notice("決定事項を修正しました。上の意見欄に、修正の意図を書き込んでください。")}
        apply(dt)},function(e){saveBtn.textContent="決定事項を保存";syncDec();fail(e)})});
    syncDec();
    d.appendChild(el("section",{cls:"decision"},[
      el("h3",{},[document.createTextNode("決定事項 "),el("span",{cls:"note",text:"（決定事項は修正できます。修正した際は上の意見欄に修正の意図を記入して下さい。）"})]),
      ta,el("div",{cls:"dec-row"},[saveBtn,saveHint])]));
  }

  function busy(){var a=document.activeElement;return state.editing||(a&&/TEXTAREA|INPUT|SELECT/.test(a.tagName)&&a.value)}
  function render(force){
    if(state.sel&&!state.issues.some(function(x){return x.id===state.sel}))state.sel=null;
    if(!state.sel&&state.issues.length)state.sel=sortedIssues()[0].id;
    renderList();
    if(!force&&busy())return; // 入力中は右側を描き直さない
    var y=window.scrollY;renderDetail();window.scrollTo(0,y);
  }

  function load(force){return call("getData").then(function(dt){state.issues=dt.issues||[];state.posts=state.posts.filter(function(p){return p.pending}).concat(dt.posts||[]);render(force)},fail)}
  $("reload").addEventListener("click",function(){load(true)});
  $("newIssue").addEventListener("submit",function(ev){ev.preventDefault();var t=$("niTitle").value.trim();if(!t)return;$("niBtn").disabled=true;
    call("addIssue",t,$("niGoal").value).then(function(dt){$("niBtn").disabled=false;$("niTitle").value="";$("niGoal").value="";var list=dt.issues||[];var last=list.reduce(function(a,b){return(b.createdAt||0)>(a.createdAt||0)?b:a},list[0]);if(last){state.sel=last.id;lsSet("selIssue",last.id)}apply(dt)},function(e){$("niBtn").disabled=false;fail(e)})});

  state.sel=lsGet("selIssue");
  if(ME.pass&&ME.name){login().catch(function(e){showLogin(e.message)})}else showLogin();
  // 30秒ごとに他のメンバーの書き込みを取り込む（入力中は画面を保つ）
  setInterval(function(){if(document.visibilityState==="visible"&&ME.pass&&!$("app").hidden)load(false)},30000);
})();
</script>
</body>
</html>
